<section class="v2-panel reference-month-summary" aria-label="月次勤怠の集計">
  <h2 class="reference-section-bar"><i class="fa-regular fa-calendar-days" aria-hidden="true"></i> 月次サマリー（{{ report.month_label }}）</h2>
  <div class="v2-kpi-grid reference-month-summary-values">
    <table class="v2-table"><tbody><tr><th scope="row">勤務完了日数</th><td>{{ completed_day_count }}日</td></tr><tr><th scope="row">実働合計</th><td>{{ report.work_display }}</td></tr><tr><th scope="row">休憩合計</th><td>{{ report.break_display }}</td></tr><tr><th scope="row">未完了の勤務</th><td>{{ report.incomplete_count }}件</td></tr><tr><th scope="row">審査中の申請</th><td>{{ report.pending_count }}件</td></tr></tbody></table>
  </div>
</section>
