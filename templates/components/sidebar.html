{% load navigation %}{% side_menu as menu %}
<nav class="side-navigation" aria-label="{{ menu.title }}">
  <p class="side-title" aria-hidden="true">{{ menu.title }}</p>
  <ul class="side-tree">
    {% for group in menu.groups %}
    <li>
      <details class="side-group"{% if group.open %} open{% endif %}>
        <summary class="side-group__toggle"><i class="{{ group.icon }}" aria-hidden="true"></i><span>{{ group.label }}</span><i class="fa-solid fa-chevron-down side-group__chevron" aria-hidden="true"></i></summary>
        <ul class="side-group__items">
          {% for item in group.items %}
          <li><a href="{{ item.url }}" class="side-link{% if item.current %} side-link--current{% endif %}"{% if item.current %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
          {% endfor %}
        </ul>
      </details>
    </li>
    {% endfor %}
  </ul>
</nav>
