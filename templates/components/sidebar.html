
{% if request.resolver_match.namespace == "management" %}

<nav class="sidebar-nav"
     aria-label="管理者メニュー">

    <p class="sidebar-heading">管理メニュー</p>

    <a href="{% url 'management:home' %}"
       class="nav-item nav-item--active"
       aria-current="page">

        <i class="fa-solid fa-house"
           aria-hidden="true"></i>

        <span>管理者ホーム</span>
    </a>

    <span class="nav-item nav-item--planned">
        <i class="fa-solid fa-calendar-check"
           aria-hidden="true"></i>
        <span>
            勤怠一覧
            <small>準備中</small>
        </span>
    </span>

    <span class="nav-item nav-item--planned">
        <i class="fa-solid fa-clipboard-list"
           aria-hidden="true"></i>
        <span>
            修正申請
            <small>準備中</small>
        </span>
    </span>

    <span class="nav-item nav-item--planned">
        <i class="fa-solid fa-users"
           aria-hidden="true"></i>
        <span>
            社員管理
            <small>準備中</small>
        </span>
    </span>

    <span class="nav-item nav-item--planned">
        <i class="fa-solid fa-file-csv"
           aria-hidden="true"></i>
        <span>
            月次確定・CSV
            <small>準備中</small>
        </span>
    </span>

    <span class="nav-item nav-item--planned">
        <i class="fa-solid fa-clock-rotate-left"
           aria-hidden="true"></i>
        <span>
            操作履歴
            <small>準備中</small>
        </span>
    </span>

    <div class="sidebar-divider"></div>

    <a href="{% url 'attendance:home' %}"
       class="nav-item">

        <i class="fa-solid fa-arrow-left"
           aria-hidden="true"></i>

        <span>社員画面へ戻る</span>
    </a>

</nav>

{% else %}

<nav class="sidebar-nav"
     aria-label="社員メニュー">

    <p class="sidebar-heading">社員メニュー</p>

    <a href="{% url 'attendance:home' %}"
       class="nav-item {% if request.resolver_match.view_name == 'attendance:home' %}nav-item--active{% endif %}"
       {% if request.resolver_match.view_name == 'attendance:home' %}
       aria-current="page"
       {% endif %}>

        <i class="fa-solid fa-clock"
           aria-hidden="true"></i>

        <span>打刻ホーム</span>
    </a>

    <span class="nav-item nav-item--planned">
        <i class="fa-solid fa-calendar-days"
           aria-hidden="true"></i>
        <span>
            自分の勤怠
            <small>準備中</small>
        </span>
    </span>

    <span class="nav-item nav-item--planned">
        <i class="fa-solid fa-pen-to-square"
           aria-hidden="true"></i>
        <span>
            修正申請
            <small>準備中</small>
        </span>
    </span>

    <a href="{% url 'accounts:password_change' %}"
       class="nav-item {% if request.resolver_match.view_name == 'accounts:password_change' %}nav-item--active{% endif %}"
       {% if request.resolver_match.view_name == 'accounts:password_change' %}
       aria-current="page"
       {% endif %}>

        <i class="fa-solid fa-user-gear"
           aria-hidden="true"></i>

        <span>パスワード変更</span>
    </a>

    {% if request.user.is_business_admin %}

    <div class="sidebar-divider"></div>

    <a href="{% url 'management:home' %}"
       class="nav-item">

        <i class="fa-solid fa-shield-halved"
           aria-hidden="true"></i>

        <span>管理者画面へ</span>
    </a>

    {% endif %}

</nav>

{% endif %}
