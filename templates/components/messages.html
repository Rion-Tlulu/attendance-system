{% if messages %}
<div class="flash-messages">
    {% for message in messages %}
    <div class="flash flash--{{ message.level_tag }}" role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}">
        <i class="fa-solid {% if message.level_tag == 'error' %}fa-circle-exclamation{% elif message.level_tag == 'success' %}fa-circle-check{% else %}fa-circle-info{% endif %}" aria-hidden="true"></i>
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
