
<nav class="mobile-nav mobile-nav-v6"
     aria-label="スマートフォン用メニュー">

    {% if request.resolver_match.namespace == "management" %}

    <a href="{% url 'management:home' %}"
       class="mobile-nav__item mobile-nav__item--active">

        <i class="fa-solid fa-clipboard-list"
           aria-hidden="true"></i>

        <span>管理者</span>
    </a>

    <a href="{% url 'attendance:home' %}"
       class="mobile-nav__item">

        <i class="fa-regular fa-clock"
           aria-hidden="true"></i>

        <span>社員画面</span>
    </a>

    {% else %}

    <a href="{% url 'attendance:home' %}"
       class="mobile-nav__item {% if request.resolver_match.view_name == 'attendance:home' %}mobile-nav__item--active{% endif %}"
       {% if request.resolver_match.view_name == 'attendance:home' %}
       aria-current="page"
       {% endif %}>

        <i class="fa-regular fa-clock"
           aria-hidden="true"></i>

        <span>打刻</span>
    </a>

    <a href="{% url 'attendance:monthly' %}"
       class="mobile-nav__item {% if request.resolver_match.view_name == 'attendance:monthly' or request.resolver_match.view_name == 'attendance:daily' %}mobile-nav__item--active{% endif %}"
       {% if request.resolver_match.view_name == 'attendance:monthly' %}
       aria-current="page"
       {% endif %}>

        <i class="fa-solid fa-file-lines"
           aria-hidden="true"></i>

        <span>自分の勤怠</span>
    </a>

    {% endif %}

    <details class="mobile-more">

        <summary class="mobile-nav__item">
            <i class="fa-solid fa-bars"
               aria-hidden="true"></i>
            <span>メニュー</span>
        </summary>

        <div class="mobile-more-panel">

            <a href="{% url 'accounts:password_change' %}">
                パスワード変更
            </a>

            {% if request.user.is_business_admin %}
<a href="{% url 'management:attendance_list' %}">勤怠一覧</a>
<a href="{% url 'management:corrections' %}">修正申請の審査</a>
<a href="{% url 'management:employees' %}">社員管理</a>
<a href="{% url 'management:audit_history' %}">操作履歴</a>
{% endif %}

            <form method="post"
                  action="{% url 'accounts:logout' %}">

                {% csrf_token %}

                <button type="submit">
                    ログアウト
                </button>

            </form>

        </div>

    </details>

</nav>
