{% extends "base.html" %}
{% block title %}初期パスワード再発行の確認 | 勤怠管理{% endblock %}

{% block content %}
<div class="page">
    <header class="page-head">
        <div>
            <a class="back-link" href="{% url 'management:employee_edit' employee.pk %}"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 社員詳細へ</a>
            <h1>初期パスワードの再発行</h1>
        </div>
    </header>
    <section class="card card--pad-lg" aria-label="再発行の対象">
        <dl class="kv-table kv-table--strong kv-table--lg">
            <dt>社員名</dt><dd>{{ employee.display_name }}</dd>
            <dt>社員番号</dt><dd>{{ employee.employee_number }}</dd>
        </dl>
        <div class="notice-box notice-box--warning"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
            <p>再発行すると現在のパスワードと既存のログインは無効になります。新しい初期パスワードは72時間有効です。</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="ticket" value="{{ ticket }}">
            <label class="check-line check-line--panel"><input type="checkbox" name="confirm" value="yes" required> 本人確認を行い、再発行による影響を確認しました</label>
            <div class="btn-row btn-row--split">
                <a class="btn btn--md btn--outline" href="{% url 'management:employee_edit' employee.pk %}">戻る</a>
                <button type="submit" class="btn btn--md">初期パスワードを再発行する</button>
            </div>
        </form>
    </section>
</div>
{% endblock %}
